name: Build & Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]

permissions:
  contents: write

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6

  build:
    name: Build (${{ matrix.variant == 'bri' && 'BRI' || 'Standard' }})
    runs-on: windows-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    strategy:
      matrix:
        variant: [standard, bri]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve Version
        id: version
        shell: pwsh
        run: |
          $ver = (git-cliff --config cliff.toml --bumped-version 2>$null) -replace '^v',''
          if (-not $ver) {
            $ver = (Get-Content wails.json | ConvertFrom-Json).info.productVersion
          }
          $w = Get-Content wails.json | ConvertFrom-Json
          $w.info.productVersion = $ver
          $w | ConvertTo-Json -Depth 5 | Set-Content wails.json
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Version: $ver"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Tests
        run: |
          if ("${{ matrix.variant }}" -eq "bri") {
            go test -v -tags bri ./internal/...
          } else {
            go test -v ./internal/...
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        shell: pwsh
        run: |
          if ("${{ matrix.variant }}" -eq "bri") {
            wails build -clean -m -tags bri -platform windows/amd64 -o pos-ecr-simulator-bri.exe
          } else {
            wails build -clean -m -platform windows/amd64
          }

      - name: Generate Changelog
        if: matrix.variant == 'standard'
        run: git-cliff --config cliff.toml --unreleased --tag "v${{ steps.version.outputs.version }}" --strip header --output build/bin/CHANGELOG_RELEASE.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'bri' && 'build-windows-bri' || 'build-windows-standard' }}
          path: |
            build/bin/*.exe
            build/bin/*.md
          retention-days: 7

  release:
    name: Release
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Commit Version Bump & Tag
        id: ver
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r '.info.productVersion' wails.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.json.tmp && mv wails.json.tmp wails.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet wails.json; then
              git commit -am "chore: bump version to v$VERSION [skip ci]"
            fi
            git tag "v$VERSION"
            git push origin main --tags
          fi

      - name: Download Standard Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows-standard
          path: release/standard

      - name: Download BRI Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows-bri
          path: release/bri

      - name: Package Standard
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: pos-simulator-windows-v${{ steps.ver.outputs.version }}.zip
          directory: release/standard
          path: .
          exclusions: "*.zip CHANGELOG_RELEASE.md"

      - name: Package BRI
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: pos-simulator-windows-v${{ steps.ver.outputs.version }}-bri.zip
          directory: release/bri
          path: .
          exclusions: "*.zip CHANGELOG_RELEASE.md"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: main
          files: |
            release/standard/pos-simulator-windows-v${{ steps.ver.outputs.version }}.zip
            release/bri/pos-simulator-windows-v${{ steps.ver.outputs.version }}-bri.zip
          body_path: release/standard/CHANGELOG_RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
