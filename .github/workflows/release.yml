name: Build & Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]

permissions:
  contents: write

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6

  build:
    name: Build (Windows)
    runs-on: windows-latest

    if: github.event.action != 'closed' || github.event.pull_request.merged == true

    outputs:
      version: ${{ steps.app_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go Tests
        run: go test -v ./internal/...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get Version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content wails.json | ConvertFrom-Json).info.productVersion

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "productVersion is missing from wails.json"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Enforce Version Bump
        shell: bash
        run: |
          if git rev-parse "v${{ steps.app_version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Version v${{ steps.app_version.outputs.version }} already exists!"
            echo "::error::Please bump 'productVersion' in wails.json."
            exit 1
          fi

      - name: Build Application
        run: wails build -clean -m -platform windows/amd64

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.app_version.outputs.version }} --strip header
        env:
          OUTPUT: build/bin/CHANGELOG_RELEASE.md

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-simulator-windows-v${{ steps.app_version.outputs.version }}
          path: |
            build/bin/*.exe
            build/bin/CHANGELOG_RELEASE.md
          retention-days: 7

  release:
    name: Release
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: pos-simulator-windows-v${{ needs.build.outputs.version }}
          path: release

      - name: Package Application
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: pos-simulator-windows-v${{ needs.build.outputs.version }}.zip
          directory: release
          path: .
          exclusions: "*.zip CHANGELOG_RELEASE.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: main
          files: release/pos-simulator-windows-v${{ needs.build.outputs.version }}.zip
          body_path: release/CHANGELOG_RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
