name: Build & Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get Version from wails.json
        id: app_version
        shell: bash
        run: |
          VERSION=$(jq -r '.info.productVersion' wails.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Enforce Version Bump (Guard)
        shell: bash
        run: |
          if [ $(git tag -l "v${{ steps.app_version.outputs.version }}") ]; then
            echo "::error::Version v${{ steps.app_version.outputs.version }} already exists! Please bump 'productVersion' in wails.json."
            exit 1
          fi

      - name: Build Application
        run: wails build -clean -m -platform windows/amd64

      - name: Package Executable into ZIP
        shell: bash
        run: |
          cd build/bin
          zip pos-simulator-windows-v${{ steps.app_version.outputs.version }}.zip *.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-simulator-windows-v${{ steps.app_version.outputs.version }}
          path: build/bin/*.zip
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event.pull_request.merged == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          target_commitish: main
          files: build/bin/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
