name: Build & Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    outputs:
      version: ${{ steps.app_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2

      - name: Get Version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content wails.json | ConvertFrom-Json).info.productVersion

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "productVersion is missing from wails.json"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Enforce Version Bump
        shell: bash
        run: |
          if git rev-parse "v${{ steps.app_version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Version v${{ steps.app_version.outputs.version }} already exists!"
            echo "::error::Please bump 'productVersion' in wails.json."
            exit 1
          fi

      - name: Build Application
        run: wails build -clean -m -platform windows/amd64

      - name: Package Application
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: pos-simulator-windows-v${{ steps.app_version.outputs.version }}.zip
          directory: build/bin
          path: .
          exclusions: "*.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-simulator-windows-v${{ steps.app_version.outputs.version }}
          path: build/bin/*.zip
          retention-days: 7

  release:
    name: Release
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: pos-simulator-windows-v${{ needs.build.outputs.version }}
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: main
          files: release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
