name: Build & Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]

permissions:
  contents: write

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6

  build:
    name: Build (Windows)
    runs-on: windows-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: ${{ runner.os }}-wails-cli

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve Version
        id: version
        shell: pwsh
        run: |
          $ver = (git-cliff --config cliff.toml --bumped-version 2>$null) -replace '^v',''
          if (-not $ver) {
            $ver = (Get-Content wails.json | ConvertFrom-Json).info.productVersion
          }
          $w = Get-Content wails.json | ConvertFrom-Json
          $w.info.productVersion = $ver
          $w | ConvertTo-Json -Depth 5 | Set-Content wails.json
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Version: $ver"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Tests
        run: |
          go test -v ./internal/...
          go test -v -tags bri ./internal/...

      - name: Build Applications
        shell: pwsh
        run: |
          # 1. Standard build
          wails build -clean -m -platform windows/amd64 -o pos-ecr-simulator.exe

          # 2. BRI build (skip redundant frontend rebuild, reuse hot Go cache)
          wails build -s -m -tags bri -platform windows/amd64 -o pos-ecr-simulator-bri.exe

      - name: Generate Changelog
        run: git-cliff --config cliff.toml --unreleased --tag "v${{ steps.version.outputs.version }}" --strip header --output build/bin/CHANGELOG_RELEASE.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            build/bin/*.exe
            build/bin/CHANGELOG_RELEASE.md
          retention-days: 7

  release:
    name: Release
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: release

      - name: Package Release Archives
        run: |
          zip -j "release/pos-simulator-windows-v${{ needs.build.outputs.version }}.zip" release/pos-ecr-simulator.exe
          zip -j "release/pos-simulator-windows-v${{ needs.build.outputs.version }}-bri.zip" release/pos-ecr-simulator-bri.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: main
          files: |
            release/pos-simulator-windows-v${{ needs.build.outputs.version }}.zip
            release/pos-simulator-windows-v${{ needs.build.outputs.version }}-bri.zip
          body_path: release/CHANGELOG_RELEASE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
